<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="TripCollab — plan together with a compatible group, see exactly where the money goes, and book hotels, trains, flights, buses, cabs and verified local guides in one place." />
  <title>Trips · TripCollab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/screens.css" />
</head>
<body data-nav="trips">
  <!-- Desktop top nav -->
  <header class="topbar">
    <span class="topbar__brand">TripCollab</span>
    <nav aria-label="Primary">
      <a data-nav="trips" href="index.html" aria-current="page">Trips</a>
      <a data-nav="discover" href="discover.html">Discover</a>
      <a data-nav="match" href="match.html">Match</a>
      <a data-nav="budget" href="budget.html">Budget</a>
      <a data-nav="profile" href="profile.html">Profile</a>
    </nav>
  </header>

  <div class="shell">
    <main class="main" id="main">
      <section class="welcome fade-up">
        <p class="welcome__kicker">Your trips</p>
        <h1 class="welcome__title">Plan together. Pay together. Go together.</h1>
        <p class="welcome__sub">One shared place for your group's plan, money and trusted local guides.</p>
      </section>

      <div id="trip-list" aria-live="polite">
        <!-- Trips rendered by JS from data.js -->
      </div>

      <div id="trip-empty" class="empty" hidden>
        <svg data-icon="i-trip" class="icon--lg" aria-hidden="true"></svg>
        <h3>No trips yet</h3>
        <p>Create a trip and invite your group to plan together.</p>
      </div>
    </main>

    <a class="fab" href="trip.html" aria-label="Create a new trip">
      <svg data-icon="i-plus" aria-hidden="true"></svg>
      <span>New trip</span>
    </a>

    <!-- Bottom tab bar (mobile) -->
    <nav class="tabbar" aria-label="Primary">
      <a data-nav="trips" href="index.html" aria-current="page"><svg class="icon" data-icon="i-trip" aria-hidden="true"></svg><span>Trips</span></a>
      <a data-nav="discover" href="discover.html"><svg class="icon" data-icon="i-discover" aria-hidden="true"></svg><span>Discover</span></a>
      <a data-nav="match" href="match.html"><svg class="icon" data-icon="i-match" aria-hidden="true"></svg><span>Match</span></a>
      <a data-nav="budget" href="budget.html"><svg class="icon" data-icon="i-budget" aria-hidden="true"></svg><span>Budget</span></a>
      <a data-nav="profile" href="profile.html"><svg class="icon" data-icon="i-profile" aria-hidden="true"></svg><span>Profile</span></a>
    </nav>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/trips.js"></script>
</body>
</html>
